<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a202c;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
        }

        /* Info panel — top-left */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            color: #e2e8f0;
            padding: 18px 22px;
            border-radius: 14px;
            min-width: 240px;
            max-width: 320px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .info-panel h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
            font-size: 0.85rem;
        }

        .info-label {
            color: #a0aec0;
            font-weight: 500;
        }

        .info-value {
            color: #e2e8f0;
            font-weight: 600;
            text-align: right;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 12px 0;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .status-generated {
            background: #2b6cb0;
            color: #bee3f8;
        }

        .status-approved {
            background: #276749;
            color: #c6f6d5;
        }

        .status-processing {
            background: #744210;
            color: #fef3c7;
        }

        .status-failed {
            background: #742a2a;
            color: #fed7d7;
        }

        /* Hint bar — bottom-center */
        .hint-bar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #a0aec0;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            white-space: nowrap;
        }

        /* Loading overlay */
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: #1a202c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            z-index: 100;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-overlay p {
            font-size: 0.95rem;
            color: #a0aec0;
        }

        /* Error overlay */
        #error-overlay {
            position: absolute;
            inset: 0;
            background: #1a202c;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            z-index: 100;
            padding: 2rem;
            text-align: center;
        }

        #error-overlay .error-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        #error-overlay h2 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        #error-overlay p {
            color: #a0aec0;
            font-size: 0.9rem;
            max-width: 400px;
        }

        /* Back button */
        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Loading overlay -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text">Loading model...</p>
    </div>

    <!-- Error overlay -->
    <div id="error-overlay">
        <div class="error-icon">⚠️</div>
        <h2>Failed to load model</h2>
        <p id="error-text">An unexpected error occurred.</p>
    </div>

    <!-- Info panel -->
    <div class="info-panel" id="info-panel" style="display:none;">
        <h2 id="model-title">—</h2>
        <div class="info-row">
            <span class="info-label">Status</span>
            <span class="info-value"><span class="status-badge" id="status-badge">—</span></span>
        </div>
        <div class="divider"></div>
        <div class="info-row">
            <span class="info-label">Frame Width</span>
            <span class="info-value" id="dim-frame">—</span>
        </div>
        <div class="info-row">
            <span class="info-label">Bridge Width</span>
            <span class="info-value" id="dim-bridge">—</span>
        </div>
        <div class="info-row">
            <span class="info-label">Temple Length</span>
            <span class="info-value" id="dim-temple">—</span>
        </div>
        <div class="divider"></div>
        <div class="info-row">
            <span class="info-label">File Size</span>
            <span class="info-value" id="file-size">—</span>
        </div>
        <div class="info-row">
            <span class="info-label">Generation Time</span>
            <span class="info-value" id="gen-time">—</span>
        </div>
    </div>

    <!-- Hint bar -->
    <div class="hint-bar">Drag to rotate &bull; Scroll to zoom &bull; Right-drag to pan</div>

    <!-- Back button -->
    <button class="back-btn" onclick="window.close()">✕ Close</button>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const API_URL = 'http://localhost:5002';

        // ── helpers ──────────────────────────────────────────────────────────

        function getQueryParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function formatFileSize(bytes) {
            if (!bytes || bytes <= 0) return 'Unknown';
            if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            return (bytes / 1024).toFixed(1) + ' KB';
        }

        function formatDuration(startIso, endIso) {
            if (!startIso || !endIso) return 'Unknown';
            const ms = new Date(endIso) - new Date(startIso);
            if (ms < 0) return 'Unknown';
            const sec = Math.round(ms / 1000);
            if (sec >= 60) return Math.floor(sec / 60) + 'm ' + (sec % 60) + 's';
            return sec + 's';
        }

        function showError(msg) {
            document.getElementById('loading-overlay').style.display = 'none';
            const overlay = document.getElementById('error-overlay');
            overlay.style.display = 'flex';
            document.getElementById('error-text').textContent = msg;
        }

        function setLoadingText(text) {
            document.getElementById('loading-text').textContent = text;
        }

        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        // ── populate info panel ───────────────────────────────────────────────

        function populateInfoPanel(item, fileSizeBytes) {
            document.getElementById('model-title').textContent =
                (item.brand || '') + ' ' + (item.model || '');

            const status = item.generationStatus || item.status || 'unknown';
            const badge = document.getElementById('status-badge');
            badge.textContent = status.toUpperCase();
            badge.className = 'status-badge status-' + status;

            const dims = item.dimensions || {};
            document.getElementById('dim-frame').textContent =
                dims.frameWidth != null ? dims.frameWidth + ' mm' : '—';
            document.getElementById('dim-bridge').textContent =
                dims.bridgeWidth != null ? dims.bridgeWidth + ' mm' : '—';
            document.getElementById('dim-temple').textContent =
                dims.templeLength != null ? dims.templeLength + ' mm' : '—';

            document.getElementById('file-size').textContent = formatFileSize(fileSizeBytes);
            document.getElementById('gen-time').textContent =
                formatDuration(item.generationStartedAt, item.generationCompletedAt);

            document.getElementById('info-panel').style.display = 'block';
        }

        // ── Three.js scene ────────────────────────────────────────────────────

        function initScene(modelUrl) {
            const container = document.getElementById('canvas-container');

            // Renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // Scene
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a202c);

            // Camera
            const camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.001,
                1000
            );
            camera.position.set(0, 0.05, 0.3);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight1.position.set(1, 2, 2);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight2.position.set(-1, -1, -1);
            scene.add(dirLight2);

            // OrbitControls
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.2;
            controls.minDistance = 0.05;
            controls.maxDistance = 5;

            // Stop auto-rotate on user interaction, resume after idle
            let autoRotateTimer = null;
            controls.addEventListener('start', function () {
                controls.autoRotate = false;
                if (autoRotateTimer) clearTimeout(autoRotateTimer);
            });
            controls.addEventListener('end', function () {
                autoRotateTimer = setTimeout(function () {
                    controls.autoRotate = true;
                }, 3000);
            });

            // Load GLB
            const loader = new THREE.GLTFLoader();
            loader.load(
                modelUrl,
                function (gltf) {
                    const model = gltf.scene;

                    // Center and fit model
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 0.2 / maxDim; // normalize to ~0.2 units

                    model.position.sub(center.multiplyScalar(scale));
                    model.scale.setScalar(scale);

                    scene.add(model);

                    // Adjust camera to fit
                    const fov = camera.fov * (Math.PI / 180);
                    const dist = (0.2 / 2) / Math.tan(fov / 2) * 1.8;
                    camera.position.set(0, 0, dist);
                    controls.target.set(0, 0, 0);
                    controls.update();

                    hideLoading();
                },
                function (xhr) {
                    if (xhr.total > 0) {
                        const pct = Math.round((xhr.loaded / xhr.total) * 100);
                        setLoadingText('Loading model... ' + pct + '%');
                    }
                },
                function (err) {
                    console.error('GLTFLoader error:', err);
                    showError('Could not load the GLB file. Make sure the backend server is running at ' + API_URL + '.');
                }
            );

            // Resize handler
            window.addEventListener('resize', function () {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Render loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }

        // ── main ──────────────────────────────────────────────────────────────

        async function main() {
            const modelId = getQueryParam('model');
            if (!modelId) {
                showError('No model ID provided in the URL. Use ?model=<id>.');
                return;
            }

            setLoadingText('Fetching model details...');

            // 1. Fetch model metadata
            let item;
            try {
                const res = await fetch(API_URL + '/admin/glasses/' + encodeURIComponent(modelId));
                if (!res.ok) throw new Error('HTTP ' + res.status);
                item = await res.json();
            } catch (err) {
                showError('Could not fetch model details from the server. ' + err.message);
                return;
            }

            // Resolve model URL
            const modelUrl = item.modelUrl
                ? API_URL + item.modelUrl
                : API_URL + '/output/' + modelId + '.glb';

            // 2. Fetch file size via HEAD request
            let fileSizeBytes = null;
            try {
                const headRes = await fetch(modelUrl, { method: 'HEAD' });
                const cl = headRes.headers.get('content-length');
                if (cl) fileSizeBytes = parseInt(cl, 10);
            } catch (_) {
                // Non-fatal — file size stays null
            }

            // 3. Populate info panel
            populateInfoPanel(item, fileSizeBytes);

            // 4. Update page title
            document.title = (item.brand || '') + ' ' + (item.model || '') + ' — Model Preview';

            // 5. Init Three.js scene
            setLoadingText('Loading 3D model...');
            initScene(modelUrl);
        }

        main();
    </script>
</body>
</html>
